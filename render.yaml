services:
  - type: web
    name: sahakarsetu-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: |
      pip install -r requirements.txt
      # Build the React frontend so the API can serve it at /app
      cd frontend && npm install && npm run build
    # Free tier has an ephemeral filesystem, so the SQLite DB resets on restart.
    # Auto-seed on every start: the script is idempotent (refuses if data exists).
    # The seed is OFF unless SAHAKARSETU_SEED_DEMO=1 -- it creates a council
    # account with a known password, which must not be a default on a public
    # host. Its stderr is deliberately NOT discarded: a seed failure is the first
    # sign of a database problem, and hiding it cost us a deploy once already.
    startCommand: |
      if [ "$SAHAKARSETU_SEED_DEMO" = "1" ]; then
        if [ -z "$SAHAKARSETU_DEMO_PASSWORD" ]; then
          echo "Refusing to seed: set SAHAKARSETU_DEMO_PASSWORD to 12+ characters." >&2
          exit 1
        fi
        python scripts/seed_demo.py; python scripts/seed_demo_data.py
      else
        echo "Demo seed skipped (set SAHAKARSETU_SEED_DEMO=1 to enable)."
      fi
      exec uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      # The shared demo code, so the deployment matches the documented walkthrough
      # without any extra setup. It is public (this repository is public) and it
      # grants full council access: set this to a random value before the host
      # holds any real data.
      - key: SAHAKARSETU_COUNCIL_CODE
        value: SABHA-2026
      - key: SAHAKARSETU_CORS_ORIGINS
        value: "https://sahakarsetu-frontend.pages.dev"
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SAHAKARSETU_COOKIE_SECURE
        value: "1"
      - key: SAHAKARSETU_COOKIE_SAMESITE
        value: "none"
      - key: SAHAKARSETU_ENV
        value: "production"
      - key: VITE_BASE_PATH
        value: "/app/"
      # Empty means "same origin", and that is correct here: this build produces
      # the copy FastAPI itself serves from /app/, so API calls go to this same
      # host at /auth, /bookings and so on. Deliberately empty rather than an
      # absolute URL so there is no hostname here that can drift out of sync
      # with the Cloudflare Pages copy. The frontend build (vite.config.ts)
      # fails if this key is missing altogether, which is why it is set to an
      # explicit empty string rather than omitted.
      - key: VITE_API_BASE_URL
        value: ""
