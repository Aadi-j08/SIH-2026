# Deploy: fly launch (once) → fly volumes create sahakarsetu_data --region sin --size 1
#          fly secrets set SAHAKARSETU_CORS_ORIGINS=https://YOUR.pages.dev \
#            SAHAKARSETU_COOKIE_SECURE=1 SAHAKARSETU_COOKIE_SAMESITE=none \
#            SAHAKARSETU_COUNCIL_CODE=SABHA-2026
#          fly deploy
#
# App name must be unique on Fly; change `app` below if taken.

app = "sahakarsetu-api"
primary_region = "sin"

[build]

[env]
  SAHAKARSETU_DB = "/data/sahakarsetu.db"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/"

[mounts]
  source = "sahakarsetu_data"
  destination = "/data"

[[vm]]
  memory = "512mb"
  cpus = 1
  cpu_kind = "shared"
