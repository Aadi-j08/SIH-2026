# Local production-shaped run: docker compose up --build
# API: http://127.0.0.1:8000  (point Pages at this host once deployed)
services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      SAHAKARSETU_DB: /data/sahakarsetu.db
      SAHAKARSETU_COUNCIL_CODE: ${SAHAKARSETU_COUNCIL_CODE:-SABHA-2026}
      # Comma-separated SPA origins (Cloudflare Pages + local Vite)
      SAHAKARSETU_CORS_ORIGINS: ${SAHAKARSETU_CORS_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173}
      SAHAKARSETU_COOKIE_SECURE: ${SAHAKARSETU_COOKIE_SECURE:-0}
      SAHAKARSETU_COOKIE_SAMESITE: ${SAHAKARSETU_COOKIE_SAMESITE:-lax}
    volumes:
      - sahakarsetu_data:/data
    restart: unless-stopped

volumes:
  sahakarsetu_data:
