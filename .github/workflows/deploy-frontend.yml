name: Deploy Frontend to Cloudflare Pages

on:
  push:
    branches: [main, master]
    paths:
      - "frontend/**"
  workflow_dispatch:

env:
  CF_PAGES: true

jobs:
  deploy:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci || npm install

      - name: Build Frontend Application
        run: npm run build
        env:
          VITE_API_BASE_URL: "https://sih-2026-1-n10c.onrender.com"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken:  REDACTED-REVOKED-TOKEN
          accountId: 128c051f5918b70c45c3ac53c04e3bf1
          command: pages deploy ./dist --project-name=sahakarsetu-frontend --commit-dirty=true
