name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-tests:
    name: Backend Pytest Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Backend Tests
        env:
          SAHAKARSETU_COUNCIL_CODE: SABHA-2026
        run: |
          pytest -v

  frontend-build:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Single source of truth, shared with the Cloudflare Pages build image
          # (which reads .node-version). Vite 8 requires ^20.19.0 || >=22.12.0.
          node-version-file: frontend/.node-version
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Frontend Application
        run: npm run build
        env:
          # Load-bearing: vite.config.ts throws when VITE_API_BASE_URL is unset,
          # so this step fails if the name is wrong or the value is missing. Keep
          # the value identical to the Cloudflare Pages environment variable.
          VITE_API_BASE_URL: "https://sih-2026-1-n10c.onrender.com"
