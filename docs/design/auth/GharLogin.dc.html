<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Manrope:wght@400..700&amp;family=Noto+Sans+Devanagari:wght@400;600&amp;display=swap">
  <style>
    body { margin: 0; background: #FCFAF6; color: #261D17; font-family: Manrope, "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #A53E00; } a:hover { color: #C65D26; }
    .display { font-family: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif; }
    .hi { font-family: "Noto Sans Devanagari", "Nirmala UI", Mangal, sans-serif; }
    svg { display: block; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #FCFAF6; display: flex; flex-direction: column; overflow: hidden; box-sizing: border-box;">

  <!-- top bar -->
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 22px 20px 0 20px;">
    <div style="display: flex; align-items: center; gap: 8px;">
      <svg width="28" height="28" viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="#C65D26"></rect><path d="M96 336c40-96 104-144 160-144s120 48 160 144" fill="none" stroke="#FCFAF6" stroke-width="40" stroke-linecap="round"></path><path d="M144 336v48M256 208v176M368 336v48" stroke="#FCFAF6" stroke-width="32" stroke-linecap="round"></path></svg>
      <div class="display" style="font-size: 19px; font-weight: 700; letter-spacing: -0.01em;">SahakarSetu</div>
      <div style="display: flex; align-items: center; height: 28px; padding: 0 10px; border-radius: 999px; background: #FFE4D6; color: #A53E00; font-size: 12px; font-weight: 700;">Ghar · Home</div>
    </div>
    <div style="display: flex; align-items: center; gap: 2px; border: 1px solid #E2DDD5; border-radius: 999px; padding: 3px;">
      <div style="font-size: 12px; font-weight: 600; padding: 6px 10px; border-radius: 999px; background: #261D17; color: #FCFAF6;">EN</div>
      <div class="hi" style="font-size: 12px; font-weight: 600; padding: 6px 10px; border-radius: 999px; color: #5C534D;">हिं</div>
    </div>
  </div>

  <!-- heading -->
  <div style="display: flex; flex-direction: column; gap: 8px; padding: 40px 20px 0 20px;">
    <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #A53E00;">For households</div>
    <div class="display" style="font-size: 32px; font-weight: 700; line-height: 1.05; letter-spacing: -0.02em;">Welcome back to Ghar.</div>
    <div class="hi" style="font-size: 16px; line-height: 1.45; color: #5C534D;">घर में आपका स्वागत है</div>
  </div>

  <!-- form -->
  <div style="display: flex; flex-direction: column; gap: 14px; padding: 28px 20px 0 20px; flex-grow: 1;">
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #8C857F;">Mobile number</div>
      <div style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 14px; border-radius: 14px; background: #FFFFFF; border: 1.5px solid #E2DDD5;">
        <div style="display: flex; align-items: center; height: 34px; padding: 0 10px; border-radius: 999px; background: #F7F3EC; color: #5C534D; font-size: 12px; font-weight: 700;">+91</div>
        <div style="font-size: 16px; color: #261D17;">98765 43210</div>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #8C857F;">Password</div>
        <div style="font-size: 13px; font-weight: 700; color: #A53E00;">Forgot?</div>
      </div>
      <div style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 14px; border-radius: 14px; background: #FFFFFF; border: 1.5px solid #261D17;">
        <div style="font-size: 16px; color: #261D17; letter-spacing: 0.2em; flex-grow: 1;">••••••••</div>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8C857F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
      </div>
    </div>

    <div class="display" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 56px; border-radius: 16px; background: #C65D26; color: #FFFFFF; font-size: 17px; font-weight: 700; margin-top: 8px;">Sign in
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
    </div>

    <div style="display: flex; align-items: center; gap: 12px; padding-top: 10px;">
      <div style="height: 1px; background: #E2DDD5; flex-grow: 1;"></div>
      <div style="font-size: 12px; font-weight: 700; color: #8C857F;">NEW TO GHAR?</div>
      <div style="height: 1px; background: #E2DDD5; flex-grow: 1;"></div>
    </div>
    <div style="display: flex; align-items: center; justify-content: center; height: 50px; border-radius: 14px; border: 1.5px solid #E2DDD5; background: #FFFFFF; color: #261D17; font-size: 15px; font-weight: 700;">Create a Ghar account</div>
  </div>

  <!-- who this is for -->
  <div style="padding: 0 20px 28px 20px;">
    <div style="display: flex; gap: 10px; padding: 12px 14px; border-radius: 12px; background: #F7F3EC; font-size: 12px; line-height: 1.5; color: #5C534D;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8C857F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 2px;"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4M12 8h.01"></path></svg>
      <div>This sign-in is for households. Workers sign in at <strong style="color: #00792F;">Kaam</strong>, council members at <strong style="color: #435AB8;">Sabha</strong>.</div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
