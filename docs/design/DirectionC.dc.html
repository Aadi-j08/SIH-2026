<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patrick+Hand&amp;display=swap">
  <style>
    body { margin: 0; background: #F4F3F0; color: #1A1A1A; font-family: "Patrick Hand", "Segoe Print", "Comic Sans MS", cursive; }
    a { color: #1A1A1A; } a:hover { color: #C65D26; }
    svg { display: block; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #F4F3F0; display: flex; flex-direction: column; overflow: hidden; box-sizing: border-box; border: 2px solid #1A1A1A;">
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 16px 18px 0 18px;">
    <div style="font-size: 14px; color: #6B6B6B; letter-spacing: 0.04em;">DIRECTION C · BOLD POSTER (sketch)</div>
    <div style="font-size: 16px;">हिंदी</div>
  </div>
  <div style="padding: 10px 18px 14px 18px; font-size: 40px; line-height: 0.95;">What do you<br>need done?</div>

  <div style="display: flex; flex-direction: column; flex-grow: 1;">
    <div style="display: flex; align-items: center; justify-content: space-between; flex-grow: 1; padding: 0 18px; background: #C65D26; color: #FFFFFF; border-top: 2px solid #1A1A1A;">
      <div style="font-size: 44px; line-height: 1;">Plumbing</div>
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>

      <div style="font-size: 44px; line-height: 1;">Electrical</div>
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; flex-grow: 1; padding: 0 18px; background: repeating-linear-gradient(135deg, #FFFFFF 0 6px, #E4E2DD 6px 8px); border-top: 2px solid #1A1A1A;">
      <div style="font-size: 44px; line-height: 1;">Carpentry</div>
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; flex-grow: 1; padding: 0 18px; background: #FFFFFF; border-top: 2px solid #1A1A1A;">

      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; flex-grow: 1; padding: 0 18px; background: repeating-linear-gradient(135deg, #FFFFFF 0 6px, #E4E2DD 6px 8px); border-top: 2px solid #1A1A1A;">
      <div style="font-size: 44px; line-height: 1;">Painting</div>
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 10px; padding: 14px 18px; background: #1A1A1A; color: #FFFFFF; font-size: 17px;">
    <div>Tap a service → then where &amp; when on the next screen</div>

</html>
