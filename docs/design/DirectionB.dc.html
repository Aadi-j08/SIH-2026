<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patrick+Hand&amp;display=swap">
  <style>
    body { margin: 0; background: #F4F3F0; color: #1A1A1A; font-family: "Patrick Hand", "Segoe Print", "Comic Sans MS", cursive; }
    a { color: #1A1A1A; } a:hover { color: #1D4ED8; }
    svg { display: block; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #F4F3F0; display: flex; flex-direction: column; gap: 14px; padding: 20px; overflow: hidden; box-sizing: border-box;">
  <div style="font-size: 14px; color: #6B6B6B; letter-spacing: 0.04em;">DIRECTION B · UTILITY FORM (sketch)</div>

  <div style="display: flex; align-items: center; justify-content: space-between; padding-bottom: 10px; border-bottom: 3px solid #1A1A1A;">
    <div style="font-size: 26px; line-height: 1;">REQUEST A WORKER</div>
    <div style="font-size: 16px; border: 2px solid #1A1A1A; padding: 2px 8px;">हिंदी</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px;">
    <div style="display: flex; align-items: center; gap: 10px; font-size: 20px;">
      <div style="display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; border: 2px solid #1A1A1A; border-radius: 999px; font-size: 16px;">1</div>
      <div>Service needed</div>
    </div>
    <div style="display: flex; flex-direction: column; border: 2px solid #1A1A1A; background: #FFFFFF;">
      <div style="display: flex; align-items: center; gap: 12px; height: 46px; padding: 0 12px; border-bottom: 2px solid #1A1A1A; background: #DCE6FB;">
        <div style="width: 18px; height: 18px; border: 2px solid #1D4ED8; border-radius: 999px; background: #1D4ED8; box-shadow: inset 0 0 0 3px #FFFFFF;"></div>
        <div style="font-size: 19px;">Plumbing</div>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; height: 46px; padding: 0 12px; border-bottom: 2px solid #1A1A1A;">
        <div style="width: 18px; height: 18px; border: 2px solid #1A1A1A; border-radius: 999px;"></div>
        <div style="font-size: 19px;">Electrical</div>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; height: 46px; padding: 0 12px; border-bottom: 2px solid #1A1A1A;">
        <div style="width: 18px; height: 18px; border: 2px solid #1A1A1A; border-radius: 999px;"></div>
        <div style="font-size: 19px;">Carpentry</div>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; height: 46px; padding: 0 12px;">
        <div style="width: 18px; height: 18px; border: 2px solid #1A1A1A; border-radius: 999px;"></div>
        <div style="font-size: 19px;">Cleaning</div>
      </div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px;">
    <div style="display: flex; align-items: center; gap: 10px; font-size: 20px;">
      <div style="display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; border: 2px solid #1A1A1A; border-radius: 999px; font-size: 16px;">2</div>
      <div>Address</div>
    </div>
    <div style="display: flex; align-items: center; height: 50px; padding: 0 12px; border: 2px solid #1A1A1A; background: #FFFFFF; font-size: 18px; color: #6B6B6B;">House no., area, city</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px;">
    <div style="display: flex; align-items: center; gap: 10px; font-size: 20px;">
      <div style="display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; border: 2px solid #1A1A1A; border-radius: 999px; font-size: 16px;">3</div>
      <div>When</div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
      <div style="display: flex; align-items: center; justify-content: center; height: 50px; border: 2px solid #1A1A1A; background: #FFFFFF; font-size: 18px;">Today</div>
      <div style="display: flex; align-items: center; justify-content: center; height: 50px; border: 2px solid #1A1A1A; background: #FFFFFF; font-size: 18px;">Pick date</div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px;">
    <div style="display: flex; align-items: center; gap: 10px; font-size: 20px;">
      <div style="display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; border: 2px solid #1A1A1A; border-radius: 999px; font-size: 16px;">4</div>
      <div>Your name &amp; mobile</div>
    </div>
    <div style="display: flex; align-items: center; height: 50px; padding: 0 12px; border: 2px solid #1A1A1A; background: #FFFFFF; font-size: 18px; color: #6B6B6B;">Name</div>
    <div style="display: flex; align-items: center; height: 50px; padding: 0 12px; border: 2px solid #1A1A1A; background: #FFFFFF; font-size: 18px; color: #6B6B6B;">Mobile</div>
  </div>

  <div style="flex-grow: 1;"></div>
  <div style="display: flex; align-items: center; justify-content: center; height: 58px; background: #1A1A1A; color: #FFFFFF; font-size: 22px; letter-spacing: 0.04em;">SUBMIT REQUEST</div>
</div>
</x-dc>
</body>
</html>
